services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: scheduler-images,scheduler-test-images
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3mock_data:/s3mockroot
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: .
    command: migrate
    environment: &service_env
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: serve
    environment: *service_env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dispatcher:
    build: .
    command: dispatch
    environment: *service_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: worker
    environment:
      <<: *service_env
      WORKER_CONCURRENCY: "4"
      LEASE_SECONDS: "30"
      SHUTDOWN_GRACE_SECONDS: "20"
      OBJECT_ENDPOINT: s3mock:9090
      OBJECT_ACCESS_KEY: test
      OBJECT_SECRET_KEY: test
      OBJECT_BUCKET: scheduler-images
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 25s

volumes:
  postgres_data:
  s3mock_data:
